
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orbit" x1="9" y1="12" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(32 30) rotate(90) scale(20)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#164E63"/>
      <stop offset="1" stop-color="#080D18"/>
    </radialGradient>
    <linearGradient id="star" x1="23" y1="20" x2="42" y2="41" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <!-- Space background -->
  <rect width="64" height="64" rx="16" fill="#080D18"/>
  <circle cx="32" cy="32" r="23" fill="url(#core)"/>

  <!-- Distant stars -->
  <circle cx="15" cy="19" r="1.2" fill="#BAE6FD"/>
  <circle cx="49" cy="15" r="1" fill="#818CF8"/>
  <circle cx="50" cy="45" r="1.3" fill="#67E8F9"/>
  <circle cx="15" cy="44" r="0.9" fill="#FFFFFF"/>

  <!-- Orbital paths -->
  <ellipse cx="32" cy="32" rx="25" ry="10.5"
           transform="rotate(-35 32 32)"
           stroke="url(#orbit)" stroke-width="2.2"/>

  <ellipse cx="32" cy="32" rx="21" ry="8"
           transform="rotate(48 32 32)"
           stroke="#38BDF8" stroke-opacity="0.65" stroke-width="1.2"/>

  <!-- Central star -->
  <path d="M32 17.5L35.8 27.1L45.5 31L35.8 34.9L32 44.5L28.2 34.9L18.5 31L28.2 27.1L32 17.5Z"
        fill="url(#star)"/>

  <circle cx="32" cy="31" r="4.2" fill="#FFFFFF"/>
  <circle cx="32" cy="31" r="7.2" stroke="#67E8F9" stroke-opacity="0.35"/>

  <!-- Orbiting planets -->
  <circle cx="12.2" cy="22.1" r="3.1" fill="#38BDF8" stroke="#BAE6FD" stroke-width="1.1"/>
  <circle cx="49.4" cy="40.8" r="2.7" fill="#818CF8" stroke="#C4B5FD" stroke-width="1"/>
  <circle cx="44.5" cy="13.9" r="1.8" fill="#FFFFFF"/>

  <!-- Subtle sparkle -->
  <path d="M51 25V29M49 27H53" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
</svg>
